# On every pushed tag v*, create a GitHub release whose notes are the
# matching "## vX.Y.Z" section of CHANGELOG.md.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take the notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            { sub(/\r$/, "") }
            index($0, "## " tag) == 1 && (length($0) == length(tag) + 3 || substr($0, length(tag) + 4, 1) == " ") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, nothing to do"
          else
            # a tag such as v0.3.0-rc1 is published as a pre-release
            pre=""
            case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $pre
          fi
